<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1 PLAYER — Ethan Cho</title>
    <meta name="description" content="1 PLAYER — Interactive Landing Page" />

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              arcadeBg: "#04041F",
            },
          },
        },
      };
    </script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body
    class="bg-[#04041F] text-white antialiased min-h-screen flex flex-col select-none overflow-x-hidden"
  >
    <!-- Main Centered Stage: Landing Screen -->
    <section
      id="landing"
      class="w-full min-h-screen flex flex-col items-center justify-center relative px-4"
    >
      <!-- Title: 1 PLAYER (Exact Figma SVG with glow) -->
      <div class="flex justify-center w-full">
        <img
          src="assets/images/one_player.svg"
          alt="1 PLAYER"
          class="w-[78vw] max-w-[660px] h-auto drop-shadow-[0_0_24px_rgba(255,255,255,0.12)] select-none pointer-events-none"
        />
      </div>

      <!-- Blue T-Tetromino Character (Overlapping bottom of title) -->
      <div
        class="relative z-10 -mt-7 sm:-mt-10 md:-mt-14 transition-transform duration-300 hover:scale-105"
      >
        <img
          src="assets/images/derp_block_trimmed.png"
          alt="Derp Block"
          class="w-32 sm:w-40 md:w-48 h-auto drop-shadow-[0_8px_24px_rgba(108,151,230,0.25)] animate-float cursor-pointer"
          id="character-btn"
        />
      </div>

      <!-- White Downward Arrow -->
      <div class="mt-8 sm:mt-12 md:mt-14 flex justify-center">
        <button
          id="start-btn"
          type="button"
          aria-label="Start Game"
          class="group focus:outline-none transition-transform active:scale-95"
        >
          <svg
            class="w-8 h-14 sm:w-10 sm:h-18 md:w-12 md:h-20 animate-bounce group-hover:drop-shadow-[0_0_16px_rgba(255,255,255,0.8)] transition-all cursor-pointer"
            viewBox="0 0 63 104"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path d="M24 0 H39 V52 H63 L31.5 104 L0 52 H24 Z" fill="white" />
          </svg>
        </button>
      </div>
    </section>

    <!-- ===== Second Section (Menu) (scrolls here when arrow is clicked) ===== -->
    <section
      id="main-content"
      class="w-full min-h-screen flex flex-col items-center justify-center px-4 py-16"
    >
      <div class="menu-board-wrapper">
        <!-- Hold Window (Left) -->
        <img
          src="assets/images/hold_window.png"
          alt="Hold Window"
          class="hold-window"
        />

        <!-- Center: Tetris Game Board -->
        <div class="image-container">
          <img
            src="assets/images/tetris_background.PNG"
            alt="Tetris Background"
            class="base-image"
          />

          <img
            src="assets/images/about_me_block.PNG"
            alt="About Me Overlay Image"
            class="overlay-image"
            style="--x: -9%; --y: 42.5%; --w: 335px; --z: 8"
          />
          <img
            src="assets/images/skills_block.PNG"
            alt="Skills Overlay Image"
            class="overlay-image"
            style="--x: 47%; --y: 64%; --w: 290px; --z: 7"
          />
          <img
            src="assets/images/hobbies_block.PNG"
            alt="Hobbies Overlay Image"
            class="overlay-image"
            style="--x: 4%; --y: 61%; --w: 330px; --z: 5"
          />
          <img
            src="assets/images/small_block.PNG"
            alt="Small Block Overlay Image"
            class="overlay-image"
            style="--x: 31%; --y: 64%; --w: 205px; --z: 6"
          />
        </div>

        <!-- Next Windows (Right) -->
        <div class="next-panel">
          <img
            src="assets/images/next_window.png"
            alt="Next Window"
            class="next-window"
          />
          <img
            src="assets/images/next_window_2.png"
            alt="Next Window 2"
            class="next-window-2"
          />
        </div>
      </div>
    </section>
    <section
      id="about-me"
      class="w-full min-h-screen flex flex-col items-center justify-center px-4"
    ></section>

    <!-- Interactive Scripts -->
    <script src="assets/js/main.js"></script>
  </body>
</html>
