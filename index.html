<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1 PLAYER — Ethan Cho</title>
    <meta name="description" content="1 PLAYER — Interactive Landing Page" />

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              arcadeBg: "#04041F",
            },
          },
        },
      };
    </script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body
    class="bg-[#04041F] text-white antialiased min-h-screen h-screen flex flex-col items-center justify-center overflow-hidden select-none"
  >
    <!-- Main Centered Stage -->
    <main
      class="w-full max-w-4xl px-4 flex flex-col items-center justify-center relative"
    >
      <!-- Title: 1 PLAYER (Exact Figma SVG with glow) -->
      <div class="flex justify-center w-full">
        <img
          src="assets/images/one_player.svg"
          alt="1 PLAYER"
          class="w-[78vw] max-w-[660px] h-auto drop-shadow-[0_0_24px_rgba(255,255,255,0.12)] select-none pointer-events-none"
        />
      </div>

      <!-- Blue T-Tetromino Character (Overlapping bottom of title) -->
      <div
        class="relative z-10 -mt-7 sm:-mt-10 md:-mt-14 transition-transform duration-300 hover:scale-105"
      >
        <img
          src="assets/images/derp_block_trimmed.png"
          alt="Derp Block"
          class="w-32 sm:w-40 md:w-48 h-auto drop-shadow-[0_8px_24px_rgba(108,151,230,0.25)] animate-float cursor-pointer"
          id="character-btn"
        />
      </div>

      <!-- White Downward Arrow -->
      <div class="mt-8 sm:mt-12 md:mt-14 flex justify-center">
        <button
          id="start-btn"
          type="button"
          aria-label="Start Game"
          class="group focus:outline-none transition-transform active:scale-95"
        >
          <svg
            class="w-8 h-14 sm:w-10 sm:h-18 md:w-12 md:h-20 animate-bounce group-hover:drop-shadow-[0_0_16px_rgba(255,255,255,0.8)] transition-all cursor-pointer"
            viewBox="0 0 63 104"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path d="M24 0 H39 V52 H63 L31.5 104 L0 52 H24 Z" fill="white" />
          </svg>
        </button>
      </div>
    </main>

    <!-- Interactive Scripts -->
    <script src="assets/js/main.js"></script>
  </body>
</html>
